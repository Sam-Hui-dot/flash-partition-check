name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon check --deny-warn
      - run: moon test --target js -p Sam-Hui-dot/flash-partition-check
      - run: moon test --target wasm-gc -p Sam-Hui-dot/flash-partition-check
      - run: moon test --target native -p Sam-Hui-dot/flash-partition-check
      - run: moon fmt --check
      - run: moon build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install intelhex==2.3.0
      - run: python demo/verify-vendor.py
      - run: python demo/verify-plan.py
      - run: python tools/source-lines.py
